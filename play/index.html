<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Backrooms — Play</title>
    <meta name="description" content="Play Open Backrooms in your browser: a free, hyper-real Backrooms horror game with P2P multiplayer and proximity voice." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Shown only if this file is served without the Vite build (e.g. Pages set to "Deploy from a branch").
      addEventListener('DOMContentLoaded', function () {
        if (!document.querySelector('script[src$=".ts"]')) return;
        document.body.innerHTML = '<div style="font:16px/1.6 system-ui;max-width:640px;margin:15vh auto;padding:0 20px;color:#ece5c8">' +
          '<h1 style="font-weight:600">Open Backrooms isn\'t built yet</h1>' +
          '<p>This is the raw source. In the repository go to <b>Settings \u2192 Pages \u2192 Source</b>, choose <b>GitHub Actions</b>, then re-run the <b>Deploy to GitHub Pages</b> workflow from the Actions tab.</p></div>';
        document.body.style.background = '#0b0a07';
      });
    </script>
  </head>
  <body>
    <canvas id="c" tabindex="0"></canvas>
    <div id="ui"></div>
    <script type="module" src="../src/game/main.ts"></script>
  </body>
</html>
